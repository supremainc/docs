# 언어별 병렬 빌드 시간 테스트 (배포하지 않음)
# 언어별로 병렬 빌드한 뒤 결과물을 병합하고, 소요 시간과 병합 결과를 확인합니다.
name: Build Time Test

on:
  workflow_dispatch:
  push:
    branches:
      - ci/build-time-test

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.locale }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        locale: [ko, en, es, ja]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build project (${{ matrix.locale }})
        run: |
          start=$(date +%s)
          npm run build -- --locale ${{ matrix.locale }}
          echo "### ${{ matrix.locale }} 빌드: $(( $(date +%s) - start ))초" >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up image directories
        run: rm -rf build/img build/en/img build/es/img build/ja/img
      - name: Pack build output
        run: tar -czf site-${{ matrix.locale }}.tar.gz -C build .
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.locale }}
          path: site-${{ matrix.locale }}.tar.gz
          compression-level: 0
          retention-days: 1

  verify:
    name: Merge & verify
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: site-*
          path: artifacts
          merge-multiple: true
      - name: Merge build outputs
        run: |
          mkdir -p build
          for f in artifacts/*.tar.gz; do tar -xzf "$f" -C build; done
      - name: Verify merged output
        run: |
          fail=0
          test -f build/index.html || { echo "::error::build/index.html 없음"; fail=1; }
          for l in en es ja; do
            test -f "build/$l/index.html" || { echo "::error::build/$l/index.html 없음"; fail=1; continue; }
            # 언어별 페이지가 자기 언어 경로(/<locale>/assets)의 자산을 참조하는지 확인
            grep -q "/$l/assets/" "build/$l/index.html" || { echo "::error::$l 페이지의 자산 경로가 /$l/로 시작하지 않음"; fail=1; }
          done
          {
            echo "### 병합 결과"
            echo "- 전체 파일 수: $(find build -type f | wc -l)"
            for l in en es ja; do echo "- $l 파일 수: $(find "build/$l" -type f 2>/dev/null | wc -l)"; done
          } >> "$GITHUB_STEP_SUMMARY"
          exit $fail
