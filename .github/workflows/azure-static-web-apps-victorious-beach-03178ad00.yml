name: Azure Static Web Apps CI/CD

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Deployment?"
        default: "Suprema"

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
          # 문서 최종 수정일(병합 날짜)을 Git 히스토리에서 읽으므로 전체 히스토리가 필요하다.
          # 기본값(1)이면 모든 문서가 최신 커밋 날짜로 표시된다. (utils/mergeDateVcs.js)
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      # - name: Upload images to Azure Blob Storage
      #   run: node uploadImage.js
      #   env:
      #     AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
      #     AZURE_STORAGE_ACCOUNT_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
      #     AZURE_STORAGE_CONTAINER_NAME: ${{ secrets.AZURE_STORAGE_CONTAINER_NAME }}
      - name: Build project
        run: npm run build
      - name: Prepare API assets
        run: |
          mkdir -p api/assets
          cp build/index.html api/assets/home.html
      - name: Clean up image directories
        run: |
          echo "Removing unnecessary image directories..."
          rm -rf build/img || true
          rm -rf build/en/img || true
          rm -rf build/es/img || true
          rm -rf build/ja/img || true
          echo "Cleanup completed"
      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_BEACH_03178AD00 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "build" # App source code path - pointing to build directory
          api_location: "api" # Api source code path - optional
          output_location: "" # Built app content directory - empty since we're pointing directly to build
          skip_app_build: true # Skip Azure's build since we already built
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_BEACH_03178AD00 }}
          action: "close"
