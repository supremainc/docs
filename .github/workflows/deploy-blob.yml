name: Deploy to Azure Blob Storage

on:
  workflow_dispatch:
    inputs:
      overwrite_assets:
        description: '이미 올라간 assets/ 파일에도 Cache-Control 속성을 다시 지정 (최초 1회 또는 캐시 정책 변경 시)'
        type: boolean
        default: false

# 배포가 동시에 실행되면 한쪽의 삭제 단계가 다른 쪽이 올린 파일을 지울 수 있으므로 한 번에 하나씩만 실행한다.
concurrency:
  group: deploy-blob
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  STORAGE_ACCOUNT: supremadocs
  RESOURCE_GROUP: technical-writer
  AFD_PROFILE: afd-suprema-docs
  AFD_ENDPOINT: suprema-docs

jobs:
  build:
    # 언어별로 병렬 빌드한다. ko는 build/, 나머지는 build/<locale>/에 출력되므로 결과물이 겹치지 않는다.
    # 언어별 단독 빌드에서도 /<locale>/ 경로가 유지되도록 docusaurus.config.js의 localeConfigs에 baseUrl을 명시해 두었다.
    name: Build (${{ matrix.locale }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        locale: [ko, en, es, ja]
    steps:
      - uses: actions/checkout@v4
        with:
          # 문서 최종 수정일(병합 날짜)을 Git 히스토리에서 읽으므로 전체 히스토리가 필요하다. (utils/mergeDateVcs.js)
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        # yarn.lock에 고정된 버전으로 설치한다. lock 파일과 package.json이 어긋나면 실패한다.
        run: yarn install --frozen-lockfile
      - name: Build project (${{ matrix.locale }})
        run: yarn build --locale ${{ matrix.locale }}
      - name: Clean up image directories
        # 이미지는 별도 Blob 컨테이너(supremadocs)에서 제공하므로 업로드하지 않는다.
        run: rm -rf build/img build/en/img build/es/img build/ja/img
      - name: Pack build output
        # 작은 파일이 많아 아티팩트 업로드가 느려지므로 하나의 tar로 묶는다.
        run: tar -czf site-${{ matrix.locale }}.tar.gz -C build .
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.locale }}
          path: site-${{ matrix.locale }}.tar.gz
          compression-level: 0
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: site-*
          path: artifacts
          merge-multiple: true
      - name: Merge build outputs
        run: |
          mkdir -p build
          for f in artifacts/*.tar.gz; do tar -xzf "$f" -C build; done
      - name: Verify merged output
        # 결과물이 누락된 채로 sync하면 --delete-destination=true 때문에 운영 파일이 삭제되므로 배포 전에 확인한다.
        run: |
          fail=0
          test -f build/index.html || { echo "::error::build/index.html 없음"; fail=1; }
          for l in en es ja; do
            test -f "build/$l/index.html" || { echo "::error::build/$l/index.html 없음"; fail=1; continue; }
            # 언어별 페이지가 자기 언어 경로(/<locale>/assets)의 자산을 참조하는지 확인
            grep -q "/$l/assets/" "build/$l/index.html" || { echo "::error::$l 페이지의 자산 경로가 /$l/로 시작하지 않음"; fail=1; }
          done
          exit $fail
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Upload hashed assets with Cache-Control
        # 파일 이름에 해시가 들어간 assets/ 폴더는 blob 속성으로 1년 immutable 캐시를 지정한다.
        # Front Door 규칙으로 덮어쓰면 404 응답에도 immutable이 붙어 브라우저가 404를 1년간 캐시하므로,
        # 실제 파일이 있을 때만 헤더가 붙도록 원본(blob)에서 지정한다.
        # 해시 파일은 이름이 같으면 내용도 같으므로 평소에는 이미 있는 파일을 건너뛴다.
        env:
          AZCOPY_AUTO_LOGIN_TYPE: AZCLI
          OVERWRITE: ${{ inputs.overwrite_assets && 'true' || 'false' }}
        run: |
          for prefix in "" en/ es/ ja/; do
            test -d "build/${prefix}assets" || continue
            azcopy copy "build/${prefix}assets" "https://${STORAGE_ACCOUNT}.blob.core.windows.net/\$web/${prefix}" \
              --recursive \
              --overwrite="$OVERWRITE" \
              --cache-control="public, max-age=31536000, immutable" \
              --put-md5
          done
      - name: Upload other files first (HTML 제외)
        # HTML이 먼저 올라가면 새 HTML이 아직 없는 main.<hash>.js를 참조해 404가 난다.
        # 따라서 HTML이 참조할 파일을 먼저 올리고, 기존 파일은 이 단계에서 지우지 않는다.
        env:
          AZCOPY_AUTO_LOGIN_TYPE: AZCLI
        run: |
          azcopy sync build "https://${STORAGE_ACCOUNT}.blob.core.windows.net/\$web" \
            --recursive \
            --exclude-pattern="*.html" \
            --delete-destination=false \
            --compare-hash=MD5 \
            --put-md5
      - name: Upload HTML (이전 파일은 아직 삭제하지 않음)
        env:
          AZCOPY_AUTO_LOGIN_TYPE: AZCLI
        run: |
          azcopy sync build "https://${STORAGE_ACCOUNT}.blob.core.windows.net/\$web" \
            --recursive \
            --delete-destination=false \
            --compare-hash=MD5 \
            --put-md5
      - name: Purge Front Door cache
        # 퍼지는 요청만 보내고 완료를 기다리지 않는다(완료까지 5~10분 이상 걸림).
        # 퍼지가 끝나기 전에 에지에 남은 이전 HTML은 이전 assets를 참조하지만,
        # 이전 assets는 아래 정리 단계에서 유예 기간 동안 남겨 두므로 404가 나지 않는다.
        run: |
          az afd endpoint purge \
            --resource-group "$RESOURCE_GROUP" \
            --profile-name "$AFD_PROFILE" \
            --endpoint-name "$AFD_ENDPOINT" \
            --content-paths "/*" \
            --no-wait
      - name: Delete stale files (assets 제외)
        # 이번 빌드에 없는 이전 파일을 삭제한다. assets/는 배포 전부터 열려 있던 페이지가
        # 이전 JS 청크를 계속 요청하므로 여기서 지우지 않고 다음 단계에서 유예 기간 후 정리한다.
        # .deploy/는 정리 단계의 상태 파일이므로 삭제하지 않는다.
        # 먼저 --dry-run으로 삭제 대상을 확인해 assets/가 하나라도 포함되면 중단한다.
        env:
          AZCOPY_AUTO_LOGIN_TYPE: AZCLI
          EXCLUDE_REGEX: '^((en|es|ja)/)?assets/|^\.deploy/'
        run: |
          DEST="https://${STORAGE_ACCOUNT}.blob.core.windows.net/\$web"
          azcopy sync build "$DEST" \
            --recursive \
            --delete-destination=true \
            --compare-hash=MD5 \
            --exclude-regex="$EXCLUDE_REGEX" \
            --dry-run > dryrun.txt
          { grep -iE 'remove|delete' dryrun.txt || true; } > removals.txt
          echo "삭제 예정: $(wc -l < removals.txt)개"
          head -50 removals.txt
          if grep -qE '(web|%24web)/((en|es|ja)/)?(assets|\.deploy)/' removals.txt; then
            echo "::error::삭제 대상에 assets/ 또는 .deploy/가 포함되어 중단합니다. --exclude-regex가 삭제에 적용되지 않았습니다."
            exit 1
          fi
          azcopy sync build "$DEST" \
            --recursive \
            --delete-destination=true \
            --compare-hash=MD5 \
            --exclude-regex="$EXCLUDE_REGEX" \
            --put-md5
      - name: Clean up stale assets (유예 기간 후 삭제)
        # 이번 빌드에 없는 assets 파일을 처음 발견한 시각을 .deploy/stale-assets.tsv에 기록하고,
        # 유예 기간(GRACE_DAYS)이 지난 파일만 삭제한다. 다시 빌드에 포함된 파일은 기록에서 빠지므로 삭제되지 않는다.
        env:
          AZCOPY_AUTO_LOGIN_TYPE: AZCLI
          GRACE_DAYS: 7
          MANIFEST: .deploy/stale-assets.tsv
        run: |
          set -euo pipefail
          export LC_ALL=C
          DEST="https://${STORAGE_ACCOUNT}.blob.core.windows.net/\$web"
          now=$(date -u +%s)

          # 현재 빌드의 assets 목록. 비정상적으로 적으면 전체가 정리 대상이 되므로 중단한다.
          ( cd build && find assets en/assets es/assets ja/assets -type f 2>/dev/null ) | sort -u > current.txt
          if [ "$(wc -l < current.txt)" -lt 1000 ]; then
            echo "::error::현재 빌드의 assets 파일이 너무 적습니다($(wc -l < current.txt)개). 정리를 중단합니다."
            exit 1
          fi

          # 원본(blob)의 assets 목록
          for p in assets/ en/assets/ es/assets/ ja/assets/; do
            az storage blob list --account-name "$STORAGE_ACCOUNT" --container-name '$web' \
              --prefix "$p" --num-results '*' --auth-mode login --only-show-errors \
              --query "[].name" -o tsv
          done | sort -u > remote.txt

          # 이전 기록(없으면 빈 파일)
          az storage blob download --account-name "$STORAGE_ACCOUNT" --container-name '$web' \
            --name "$MANIFEST" --file prev.tsv --auth-mode login --only-show-errors >/dev/null 2>&1 || : > prev.tsv

          comm -23 remote.txt current.txt > stale.txt
          : > delete.txt; : > next.tsv
          awk -F'\t' -v now="$now" -v grace="$((GRACE_DAYS * 86400))" '
            FILENAME == ARGV[1] { since[$1] = $2; next }
            {
              s = ($1 in since) ? since[$1] : now
              if (now - s >= grace) print $1 > "delete.txt"
              else printf "%s\t%s\n", $1, s > "next.tsv"
            }' prev.tsv stale.txt

          echo "원본 assets: $(wc -l < remote.txt)개, 현재 빌드: $(wc -l < current.txt)개"
          echo "빌드에 없는 assets: $(wc -l < stale.txt)개 (유예 중: $(wc -l < next.tsv)개, 삭제: $(wc -l < delete.txt)개)"

          if [ -s delete.txt ]; then
            azcopy remove "$DEST" --list-of-files=delete.txt
          fi
          az storage blob upload --account-name "$STORAGE_ACCOUNT" --container-name '$web' \
            --name "$MANIFEST" --file next.tsv --overwrite --auth-mode login --only-show-errors \
            --content-type "text/plain; charset=utf-8" >/dev/null